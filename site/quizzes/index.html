<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizMap — etienneunai.com</title>
  <meta name="description" content="Discover quiz nights in Western Australia.">
  <meta name="author" content="Etienne Vinton Horn">
  <link rel="canonical" href="https://etienneunai.com/quizzes">

  <meta name="theme-color" content="#FAFAEA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&family=Ovo&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" style="text-decoration: none;">
        <h1 class="brand" aria-label="etienneunai.com">etienneunai.com</h1>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="projects" aria-labelledby="map-heading">
      <h2 class="section-title" id="map-heading">QuizMap</h2>
      <p>Map of WA quiz nights, with data sourced from <a href="https://quizfinder.com.au/" target="_blank" rel="noopener noreferrer">QuizFinder.com.au</a><br>Venues are colour-coded on their distance from the nearest station.</p>
      <nav class="filter-controls" id="filter-nav">
        <button class="filter-btn active" data-day="All">All</button>
        <button class="filter-btn" data-day="Monday">Monday</button>
        <button class="filter-btn" data-day="Tuesday">Tuesday</button>
        <button class="filter-btn" data-day="Wednesday">Wednesday</button>
        <button class="filter-btn" data-day="Thursday">Thursday</button>
        <button class="filter-btn" data-day="Friday">Friday</button>
        <button class="filter-btn" data-day="Saturday">Saturday</button>
        <button class="filter-btn" data-day="Sunday">Sunday</button>
      </nav>

      <div id="commute-legend" class="commute-legend" aria-live="polite">
        <span><i class="legend-dot commute-near"></i>Near (< 15 mins)</span>
        <span><i class="legend-dot commute-medium"></i>Medium (15 - 30 mins)</span>
        <span><i class="legend-dot commute-far"></i>Far (&gt; 30 mins)</span>
      </div>

      <div id="status-panel" class="status-panel hidden">
        <span id="status-text">Loading quizzes...</span>
      </div>

      <div class="map-viewport">
        <div id="map"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Etienne Vinton Horn</p>
    </div>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="map.js"></script>
</body>
</html>
